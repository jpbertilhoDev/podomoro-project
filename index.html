<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo ao Fokus</title>
    <link rel="stylesheet" href="../css/welcome.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-content">
            <!-- Logo -->
            <div class="welcome-logo">
                <img src="../imagens/logo.png" alt="Fokus Logo">
            </div>

            <!-- Texto de boas-vindas -->
            <h1 class="welcome-title">
                Bem-vindo ao Fokus
                <span class="welcome-subtitle">Sua jornada para maior produtividade começa aqui</span>
            </h1>

            <!-- Pergunta e botões -->
            <div class="welcome-question">
                <h2>Como você quer começar?</h2>
                
                <div class="welcome-buttons">
                    <!-- Botão para novos usuários -->
                    <div class="welcome-option">
                        <h3>Sou novo por aqui</h3>
                        <p>Crie sua conta e comece sua jornada</p>
                        <a href="./pages/login.html?type=register" class="welcome-button new-user">
                            Criar conta
                            <span class="button-icon">→</span>
                        </a>
                    </div>

                    <!-- Botão para usuários existentes -->
                    <div class="welcome-option">
                        <h3>Já tenho uma conta</h3>
                        <p>Continue sua jornada de produtividade</p>
                        <a href="./pages/login.html?type=login" class="welcome-button existing-user">
                            Fazer login
                            <span class="button-icon">→</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Elementos decorativos flutuantes -->
            <div class="floating-elements">
                <img src="../assets/images/clock.png" alt="Relógio" class="float-1">
                <img src="../assets/images/target.png" alt="Alvo" class="float-2">
                <img src="../assets/images/check.png" alt="Check" class="float-3">
            </div>
        </div>
    </div>
</body>
</html>
