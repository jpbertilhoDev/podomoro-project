<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fokus - Login</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <!-- Lado esquerdo - Formulários -->
        <div class="auth-forms">
            <div class="auth-logo">
                <img src="../imagens/logo.png" alt="Fokus Logo">
            </div>

            <!-- Formulário de Login -->
            <div class="auth-form" id="loginForm">
                <h2>Bem-vindo de volta!</h2>
                <p class="auth-subtitle">Continue sua jornada de produtividade</p>
                
                <form>
                    <div class="form-group">
                        <input type="email" id="loginEmail" required>
                        <label for="loginEmail">E-mail</label>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" id="loginPassword" required>
                        <label for="loginPassword">Senha</label>
                    </div>

                    <button type="submit" class="auth-button">Entrar</button>
                </form>

                <p class="auth-switch">
                    Não tem uma conta? 
                    <a href="#" id="showRegister">Registre-se</a>
                </p>
            </div>

            <!-- Formulário de Registro -->
            <div class="auth-form hidden" id="registerForm">
                <h2>Crie sua conta</h2>
                <p class="auth-subtitle">Comece sua jornada de produtividade</p>
                
                <form>
                    <div class="form-group">
                        <input type="text" id="registerName" required>
                        <label for="registerName">Nome</label>
                    </div>

                    <div class="form-group">
                        <input type="email" id="registerEmail" required>
                        <label for="registerEmail">E-mail</label>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" id="registerPassword" required>
                        <label for="registerPassword">Senha</label>
                    </div>

                    <button type="submit" class="auth-button">Criar conta</button>
                </form>

                <p class="auth-switch">
                    Já tem uma conta? 
                    <a href="#" id="showLogin">Faça login</a>
                </p>
            </div>
        </div>

        <!-- Lado direito - Imagem/Animação -->
        <div class="auth-image">
            <div class="image-content">
                <h2>Foque no que importa</h2>
                <p>Gerencie seu tempo, aumente sua produtividade</p>
                <div class="floating-elements">
                    <img src="../imagens/clock.png" alt="Relógio" class="float-1">
                    <img src="../imagens/target.png" alt="Alvo" class="float-2">
                    <img src="../imagens/check.png" alt="Check" class="float-3">
                </div>
            </div>
        </div>
    </div>

    <script src="../scripts/auth/auth.js"></script>
</body>
</html>
